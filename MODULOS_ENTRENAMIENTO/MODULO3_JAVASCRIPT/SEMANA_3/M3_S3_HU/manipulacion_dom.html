<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Notes List App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h1>Notes List</h1>
    <p>Write a note and click “Add”</p>

    <div class="input-group">
      <input type="text" id="noteInput" placeholder="Write a note..." />
      <button id="addBtn">Add</button>
    </div>

    <ul id="notesList"></ul>
  </div>

  <script src="app.js"></script>
</body>
</html>
